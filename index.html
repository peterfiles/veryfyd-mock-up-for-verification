<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Veryfyd Verification Prototype</title>
<style>
:root{--bg:#080c0f;--panel:#10161a;--card:#151d22;--line:#273138;--text:#f4f6f7;--muted:#aab3ba;--gold:#ffd43b;--red:#ff5757;--green:#35c96f}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#162027,#070a0c 55%);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
.shell{width:min(430px,100%);margin:auto;min-height:100vh;background:#0b1013;box-shadow:0 0 60px #000}
.top{height:58px;display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--line);font-weight:750;position:sticky;top:0;background:#0b1013ee;z-index:3}.back{position:absolute;left:18px;font-size:25px;cursor:pointer}
.content{padding:14px}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px}.tab{border:1px solid var(--line);border-radius:10px;padding:11px 4px;text-align:center;background:#12191e;color:#75818a;font-size:12px}.tab.active{background:var(--gold);color:#151515;font-weight:800}.tab.locked{cursor:not-allowed}.hero,.card{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:15px;margin-bottom:12px}.hero h2{margin:0 0 3px}.hero p,.muted{color:var(--muted);margin:5px 0;line-height:1.45}.step{display:flex;gap:12px}.num{width:32px;height:32px;border-radius:8px;background:#e8eef1;color:#101417;display:grid;place-items:center;font-weight:900;flex:none}.grow{flex:1}.req{color:var(--red);font-size:12px;font-weight:700}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.status{color:var(--muted);font-size:13px}.chev{font-size:22px}.btn{width:100%;border:0;border-radius:10px;padding:14px 12px;font-weight:850;font-size:15px;background:var(--gold);color:#171717;cursor:pointer}.btn.secondary{background:#182126;color:#fff;border:1px solid #5b6971}.btn:disabled{background:#384047;color:#929aa0;cursor:not-allowed}.idcard{display:flex;gap:10px;align-items:center;margin-top:10px;padding:10px;background:#0d1316;border-radius:10px}.thumb{width:68px;height:42px;border-radius:6px;background:linear-gradient(135deg,#d9f0ff,#fff3cf);color:#344;text-align:center;padding-top:12px;font-size:10px;font-weight:800}.ok{color:var(--green);font-size:20px}
label{display:block;margin:13px 0 6px;font-weight:700}.field,select{width:100%;background:#0c1215;color:#fff;border:1px solid #3b4850;border-radius:9px;padding:13px}.options{display:grid;gap:8px}.option{padding:13px;border:1px solid var(--line);background:#12191d;border-radius:10px;display:flex;align-items:center;gap:10px;cursor:pointer}.option:hover,.option.selected{border-color:var(--gold)}.radio{margin-left:auto;width:18px;height:18px;border:2px solid #71808a;border-radius:50%}.selected .radio{border:5px solid var(--gold)}
.center{text-align:center;padding:30px 10px}.icon{font-size:64px}.review{display:grid;gap:10px}.review .card{margin:0}.notice{background:#182027;border:1px solid #38454c;border-radius:12px;padding:13px;color:#c7d0d5}.drawer{padding:22px}.brand{font-size:25px;font-weight:900;margin-bottom:18px}.brand b{color:var(--gold)}.profile{padding:12px 0 18px;border-bottom:1px solid var(--line);font-weight:700}.menu{display:grid;gap:6px;margin-top:12px}.mi{padding:13px;border-radius:10px}.mi.active{border:1px solid var(--gold)}.logout{color:#ff5757;margin-top:22px}.hidden{display:none}.progress{height:7px;background:#263139;border-radius:9px;overflow:hidden;margin:20px 0}.bar{height:100%;width:0;background:var(--gold);animation:load 1.4s forwards}@keyframes load{to{width:100%}}.hint{text-align:center;color:#7f8a91;font-size:12px;margin-top:18px}
</style>
</head>
<body><main class="shell"><div id="app"></div></main>
<script>
const primary=["Driver's License","PhilSys National ID","PRC ID","UMID","Voter's ID","TIN ID"];
const secondary=["PhilHealth ID","SSS ID","Voter's ID","Postal ID","TIN ID","Barangay ID","School ID"];
let state={screen:"menu",primary:null,secondary:null,pnum:"",snum:"",video:false};
const app=document.querySelector("#app");
function top(title,back=true){return '<div class="top">'+(back?'<span class="back" onclick="goBack()">‹</span>':'')+title+'</div>'}
function tabs(){return '<div class="tabs"><div class="tab active">🛡<br>Level 2</div><div class="tab locked">🔒<br>Level 3</div><div class="tab locked">🔒<br>Level 4</div><div class="tab locked">🔒<br>Level 5</div></div>'}
function menu(){app.innerHTML='<div class="drawer"><div class="brand"><b>✓</b> Veryfyd</div><div class="profile">👤 &nbsp; Maxi Peel Example<br><span class="muted">@mexample</span></div><div class="menu"><div class="mi">🏠 &nbsp; Feeds</div><div class="mi">👥 &nbsp; Connections</div><div class="mi">♙ &nbsp; Invite Friends</div><div class="mi">👥 &nbsp; Communities</div><div class="mi">👨‍👩‍👧 &nbsp; Manage Children</div><div class="mi">🔖 &nbsp; Saved Posts</div><div class="mi">↗ &nbsp; Creator Studio</div><div class="mi">♙ &nbsp; Profile</div><div class="mi active" onclick="state.screen=\'level2\';render()">🛡 &nbsp; Verification</div><div class="mi">⚙ &nbsp; Settings</div></div><div class="logout">↪ &nbsp; Log Out</div></div>'}
function level2(){let complete=state.primary&&state.secondary&&state.video&&state.pnum&&state.snum;app.innerHTML=top("Verification Center")+ '<div class="content">'+tabs()+'<div class="hero"><h2>🛡 Level 2</h2><b>Verified User (Basic Access)</b><p>Upload 2 valid government-issued IDs and complete a manual video verification.</p></div>'+step(1,"Primary ID",state.primary?state.primary+" • "+state.pnum:"Select and upload your Government-issued Primary ID.","primary")+step(2,"Secondary ID",state.secondary?state.secondary+" • "+state.snum:"Select and upload your Secondary ID.","secondary")+step(3,"Manual Video Verification",state.video?"Recorded • Ready":"Record a short video for identity verification.","video")+'<button class="btn" '+(!complete?'disabled':'')+' onclick="state.screen=\'review\';render()">Submit Level 2 Verification</button><div class="hint">Levels 3–5 unlock only after Level 2 is approved.</div></div>'}
function step(n,title,desc,target){return '<div class="card step" onclick="state.screen=\''+target+'\';render()"><div class="num">'+n+'</div><div class="grow"><div class="row"><b>'+title+'</b><span class="req">Required</span></div><div class="status">'+desc+'</div></div><div class="chev">›</div></div>'}
function picker(kind){let arr=kind==="primary"?primary:secondary,title=kind==="primary"?"Primary ID Type":"Secondary ID Type";app.innerHTML=top(title)+'<div class="content"><p class="muted">Select your '+(kind==="primary"?"Government-issued Primary":"Secondary")+' ID.</p><div class="options">'+arr.map(x=>'<div class="option '+(state[kind]===x?'selected':'')+'" onclick="state.'+kind+'=\''+x.replace(/'/g,"\\'")+'\';state.screen=\''+kind+'Upload\';render()"><span class="thumb">ID</span><b>'+x+'</b><span class="radio"></span></div>').join("")+'</div></div>'}
function upload(kind){let isP=kind==="primary",name=state[kind];app.innerHTML=top("Upload "+(isP?"Primary":"Secondary")+" ID")+'<div class="content"><div class="center"><div class="thumb" style="margin:auto;width:150px;height:90px;padding-top:35px">SAMPLE ID</div><h3>'+name+'</h3></div><button class="btn secondary" onclick="fakeUpload(this)">📷 Take a Photo / Choose from Gallery</button><label>ID Number <span class="req">*</span></label><input class="field" id="idnum" value="'+(isP?state.pnum:state.snum)+'" placeholder="Enter ID number"><br><br><button class="btn" onclick="saveId(\''+kind+'\')">Save & Continue</button></div>'}
function fakeUpload(b){b.textContent="✓ ID image selected";b.style.borderColor="var(--green)"}
function saveId(kind){let v=document.querySelector("#idnum").value.trim();if(!v){alert("Please enter the ID number.");return}if(kind==="primary")state.pnum=v;else state.snum=v;state.screen="level2";render()}
function video(){app.innerHTML=top("Manual Video Verification")+'<div class="content"><div class="center"><div class="icon">👤</div><h2>Identity Video</h2></div><div class="notice">✓ Show your face clearly<br>✓ Follow the on-screen instructions<br>✓ Be in a well-lit area<br>✓ Video should be 10–30 seconds</div><br><button class="btn secondary" onclick="record()">📹 '+(state.video?"Record Again":"Record Video")+'</button></div>'}
function record(){let b=document.querySelector(".btn");b.textContent="● Recording…";setTimeout(()=>{state.video=true;state.screen="level2";render()},1600)}
function review(){app.innerHTML=top("Review & Submit")+'<div class="content"><h2>Confirm your details</h2><div class="review">'+r("Primary ID",state.primary,state.pnum)+r("Secondary ID",state.secondary,state.snum)+r("Video Verification","Recorded","10–30 second verification video")+'</div><br><div class="notice">☑ I confirm that all information and documents submitted are true and correct.</div><br><button class="btn" onclick="submit()">Submit Level 2 Verification</button></div>'}
function r(t,a,b){return '<div class="card"><b>'+t+'</b><p class="muted">'+a+'<br>'+b+'</p><span class="ok">✓ Ready</span></div>'}
function submit(){state.screen="submitting";render();setTimeout(()=>{state.screen="underReview";render()},1700)}
function submitting(){app.innerHTML=top("Submitting",false)+'<div class="content center"><div class="icon">➤</div><h2>Submitting Your Verification</h2><p class="muted">Please wait while we submit your documents and video verification.</p><div class="progress"><div class="bar"></div></div><b>Submitting…</b></div>'}
function underReview(){app.innerHTML=top("Verification Status",false)+'<div class="content center"><div class="icon">🕒</div><h2>Verification Under Review</h2><p>Your Level 2 verification has been submitted successfully.</p><div class="notice">Our admin team is now reviewing your submitted IDs and manual video verification. You will be notified once verification is completed.</div><br><button class="btn secondary" onclick="state.screen=\'level2\';render()">Back to Verification Center</button></div>'}
function goBack(){if(["primary","secondary","video","review"].includes(state.screen))state.screen="level2";else if(state.screen==="primaryUpload")state.screen="primary";else if(state.screen==="secondaryUpload")state.screen="secondary";else state.screen="menu";render()}
function render(){({menu,level2,primary:()=>picker("primary"),secondary:()=>picker("secondary"),primaryUpload:()=>upload("primary"),secondaryUpload:()=>upload("secondary"),video,review,submitting,underReview}[state.screen]||menu)()}
render();
</script></body></html>
